<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projectdetail — Open Source Catalogus</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="components/tag-filter.css" />
  <link rel="stylesheet" href="components/project-detail.css" />
  <link rel="stylesheet" href="components/software-type-badge.css" />
  <link rel="stylesheet" href="components/activity-panel.css" />
  <link rel="stylesheet" href="components/avatar-stack.css" />
  <link rel="stylesheet" href="components/commit-graph.css" />
  <link rel="stylesheet" href="components/contact-list.css" />
  <link rel="stylesheet" href="components/dependency-list.css" />
  <link rel="stylesheet" href="components/language-list.css" />
  <link rel="stylesheet" href="components/repository-rules.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html">
      <p class="site-header__title">Open Source Catalogus</p>
      <p class="site-header__subtitle">Open source projecten van de Nederlandse overheid</p>
    </a>
  </header>

  <main class="page">
    <p><a href="index.html">← Terug naar overzicht</a></p>
    <div id="project-detail"></div>
  </main>

  <template id="tpl-project-detail">
    <article class="project-detail">
      <div class="project-detail__warning-notice badge" hidden>
        ⚠ Geen <code>publiccode.yml</code> gevonden voor dit project — onderstaande metadata
        is mogelijk onvolledig of niet geverifieerd.
      </div>

      <div class="project-detail__header">
        <div>
          <h1 class="project-detail__name"></h1>
          <p class="project-detail__org"></p>
        </div>
        <a class="project-detail__repo-link button" href="#" target="_blank" rel="noopener">
          Bekijk broncode op GitHub ↗
        </a>
      </div>

      <p class="project-detail__description"></p>

      <dl class="project-detail__facts">
        <div>
          <dt>Softwaretype</dt>
          <dd class="project-detail__software-type"></dd>
        </div>
        <div>
          <dt>Licentie</dt>
          <dd class="project-detail__license"></dd>
        </div>
        <div>
          <dt>Organisatie</dt>
          <dd class="project-detail__org-fact"></dd>
        </div>
      </dl>

      <div class="project-detail__tags"></div>

      <section class="project-detail__section">
        <h2>Programmeertalen</h2>
        <div class="language-list" id="language-list"></div>
      </section>

      <section class="project-detail__section">
        <h2>Contributor- en PR-activiteit</h2>
        <div class="activity-panels" id="activity-panels"></div>
        <div class="commit-graph" id="commit-graph"></div>
      </section>

      <section class="project-detail__section">
        <h2>Repositoryregels</h2>
        <div class="repository-rules" id="repository-rules"></div>
      </section>

      <section class="project-detail__section">
        <h2>Package managers &amp; dependencies</h2>
        <div class="dependency-list" id="dependency-list"></div>
      </section>

      <section class="project-detail__section">
        <h2>Contact</h2>
        <div class="contact-list" id="contact-list"></div>
      </section>
    </article>
  </template>

  <template id="tpl-tag-chip">
    <button type="button" class="tag-chip">
      <span class="tag-chip__label"></span>
    </button>
  </template>

  <template id="tpl-not-found">
    <div class="empty-state">
      <p class="empty-state__message">Project niet gevonden.</p>
      <p class="empty-state__hint"><a href="index.html">Terug naar het overzicht</a></p>
    </div>
  </template>

  <template id="tpl-activity-panel">
    <div class="activity-panel">
      <h3 class="activity-panel__label"></h3>
      <div class="activity-panel__avatars avatar-stack"></div>
      <p class="activity-panel__stat">
        <span class="activity-panel__value activity-panel__contributors"></span>
        contributors
      </p>
      <p class="activity-panel__stat">
        <span class="activity-panel__value activity-panel__prs"></span>
        PR's gesloten
      </p>
    </div>
  </template>

  <template id="tpl-contact">
    <div class="contact-card">
      <p class="contact-card__name"></p>
      <p class="contact-card__email"></p>
      <p class="contact-card__affiliation"></p>
    </div>
  </template>

  <template id="tpl-dependency-row">
    <button type="button" class="dependency-row" aria-pressed="false">
      <span class="dependency-row__vulns" hidden></span>
      <span class="dependency-row__ecosystem"></span>
      <span class="dependency-row__count">
        <span class="dependency-row__direct"></span>
        <span class="dependency-row__transitive"></span>
      </span>
    </button>
  </template>

  <template id="tpl-repository-rule">
    <li class="repository-rule">
      <span class="repository-rule__icon" aria-hidden="true"></span>
      <span class="repository-rule__label"></span>
      <span class="repository-rule__status"></span>
    </li>
  </template>

  <template id="tpl-dependency-top-row">
    <li class="dependency-top-row">
      <div class="dependency-top-row__main">
        <span class="dependency-top-row__name"></span>
      </div>
      <span class="dependency-top-row__count"></span>
      <div class="dependency-top-row__bar"><span class="dependency-top-row__bar-fill"></span></div>
    </li>
  </template>

  <template id="tpl-language-tag">
    <a class="language-tag"></a>
  </template>

  <script type="module" src="detail.js"></script>
</body>
</html>
