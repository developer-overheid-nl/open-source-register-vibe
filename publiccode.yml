# This repository adheres to the publiccode.yml standard by including this
# metadata file that makes public software easily discoverable.
# More info at https://github.com/publiccodeyml/publiccode.yml

publiccodeYmlVersion: "0.7"

# Dit veld bevat de korte naam van het project. Kies hier de naam waaronder het
# project bekend is bij de meeste mensen.
name: Open Source Catalogus

# De url naar de source code.
url: https://github.com/developer-overheid-nl/open-source-register-vibe.git


# Type software zoals te vinden op: https://yml.publiccode.tools/schema.core.html#key-softwaretype
softwareType: standalone/web

# Vul hier in op welke platforms de gebruiker de applicatie uitendelijk gaat
# gebruiken. Dus niet op welk platform de software zelf draait.
platforms:
  - web

# De beschrijving van de verschillende statussen zijn te vinden op: https://yml.publiccode.tools/schema.core.html#key-developmentstatus
developmentStatus: concept

description:
  nl:
    # Mand! Maximaal 150 karakters
    shortDescription:
      Proof of concept van een catalogus voor open source overheidsprojecten.
    
    # Minimaal 150 karakters, max 10000
    longDescription: >
      Proof of concept van een catalogus voor open source overheidsprojecten, gebouwd om functies te evalueren voordat ze in het daadwerkelijke product worden opgenomen. Een Rust-commandline-tool bevraagt de GitHub API voor een gecureerde lijst open source overheidsprojecten (publiccode.yml, contributors, pull requests, talen en dependencies) en schrijft het resultaat weg naar een statisch JSON-bestand. Een statische frontend in vanilla JavaScript toont op basis daarvan een doorzoekbare catalogus met filters en een detailpagina per project. Projectmetadata volgt de publiccode.yml-standaard.
    
    features:
        - Catalogus van open source overheidsprojecten
        - Zoeken en filteren op tags, talen en organisaties
        - Projectdetailpagina met contributors, activiteit, talen en dependencies
        - Data-ingest uit de GitHub API en publiccode.yml

legal:
  # De licentie volgens de identifier van de SPDX standaard: https://spdx.org/licenses/
  license: EUPL-1.2
  # Wie is de eigenaar van de copyright op de code?
  mainCopyrightOwner: developer.overheid.nl

# Voor welk publiek is deze repository bedoeld?
intendedAudience: # optioneel
  # In welk land?
  countries:
    - NL
  # En in welke sector?
  # De mogelijke tags vind je hier: https://yml.publiccode.tools/scope-list.html#scope-list
  scope:
    - government

localisation:
  # In welke talen is dit project beschikbaar?
  # Invullen volgens IETF BCP 47 standaard: https://www.iana.org/assignments/language-subtag-registry/language-subtag-registry
  availableLanguages:
    - nl
  # Kunnen er meerdere talen geconfigureerd worden?
  localisationReady: false

maintenance:
  # Hoe is het onderhoud georganiseerd?
  # Doet een extern bedrijf het onderhoud? Kies dan: contract
  # Is het onderhoud intern belegd? Kies dan: internal
  type: internal

  # Wie kan ik bereiken bij vragen?
  contacts:
      - name: Tom Ootes
        email: t.ootes@geonovum.nl
        affiliation: Geonovum
        

# Standaarden, regelgeving of kaders waar dit project aan voldoet.
supports:
  - id: https://yml.publiccode.tools/
